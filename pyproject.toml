[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-crawl-kit"
version = "0.1.0"
description = "Agent capability pack for web search, crawling, extraction, and evidence-preserving output."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-crawl = "agent_crawl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

